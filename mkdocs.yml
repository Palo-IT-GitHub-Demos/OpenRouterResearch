site_name: Model Compass
site_description: >-
  Pipeline de recommandation technique des modèles OpenRouter — qualité, sécurité, coût et performance.
repo_url: https://github.com/Palo-IT-GitHub-Demos/model-compass
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false

nav:
  - Accueil: index.md
  - "Scope Model Compass": model-compass-scope.md
  - Workflow: workflow.md
  - "Système multiprobe": multiprobe-system.md
  - "Méthodologie qualité": quality-methodology.md
  - "Méthodologie sécurité": security-methodology.md
  - "Validation qualité":
      - "Revue v1": quality-validation/review-v1.md
      - "Template comparaison gen-e2-eval": quality-validation/gen-e2-eval-comparison-template.md
  - "Audit critique (2026-08-21)": audit-2026-08-21.md
  - Référence API: reference/api.md
  - ADR:
      - "0001 — Architecture initiale": adr/0001-architecture-initiale.md
  - Plans:
      - "Roadmap d'amélioration (2026)": plans/project-improvement-roadmap-2026.md
      - "V2 — Pipeline async, observabilité, juge hybride": plans/feature-pipeline-v2-1.md
      - "Sécurité & coût — spécialisation": plans/feature-security-cost-specialization-1.md
  - Maintenance de la documentation: documentation.md
  - "Brief manager (2026-08-17)": brief-manager-2026-08-17.md
  - "Brief manager (2026-09-08)": brief-manager-2026-09-08.md
