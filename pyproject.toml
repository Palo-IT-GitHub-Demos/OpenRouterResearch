[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-router-research"
version = "0.1.0"
description = "Doing researches on openrouter llm evaluation considering Security, Performance and cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "pydantic-settings>=2.5",
    "tenacity>=8.0",
    "httpx>=0.27",
    "mlflow>=2.0",
    "streamlit>=1.35",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "mlflow.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"
