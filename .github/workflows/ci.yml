name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null \
            || pip install -r requirements-dev.txt 2>/dev/null \
            || echo "No Python deps to install"

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Type check (mypy)
        run: mypy src/ || true

      - name: Test (pytest)
        run: pytest --tb=short

  typescript:
    name: TypeScript — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || echo "No package-lock.json found, skipping"

      - name: Lint
        run: npm run lint || true

      - name: Type check
        run: npm run type-check || true

      - name: Test
        run: npm test || true
